<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}

<div id="app" class="app" data-view="list">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="15" r="9" fill="var(--sun)"/><path d="M0 24c5-3.200 8.500-3.200 13 0s8.500 3.200 13 0 8.500-3.200 14 0v16H0z" fill="var(--fogline)"/><path d="M0 31c5-3.200 8.500-3.200 13 0s8.500 3.200 13 0 8.500-3.200 14 0v9H0z" fill="var(--fogline2)"/></svg>
      <div class="brand-text"><h1>Sonnenseite</h1><span>Swiss sun finder</span></div>
    </div>
    <button id="btn-home" class="chip chip-home" type="button" title="Change your starting point"><svg class="ic"><use href="#i-pin"/></svg><span id="home-name">Zürich</span></button>
    <button id="btn-refresh" class="iconbtn" type="button" title="Refresh data" aria-label="Refresh data"><svg class="ic"><use href="#i-refresh"/></svg></button>
    <button id="btn-settings" class="iconbtn" type="button" title="Settings" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
  </header>

  <section class="when" aria-label="Day and time">
    <div id="days" class="days" role="tablist"></div>
    <div class="hourbar">
      <label for="hour" class="sr">Hour of day</label>
      <input id="hour" type="range" min="0" max="23" step="1" value="12">
      <output id="hour-label" for="hour">12:00</output>
      <button id="btn-now" class="chip" type="button">Now</button>
    </div>
  </section>

  <div id="banner" class="banner" hidden></div>

  <main class="panes">
    <section id="pane-list" class="pane pane-list" aria-label="Sun finder">
      <div id="brief" class="brief"></div>
      <div class="listhead">
        <h2 id="list-title">Where the sun is</h2>
        <div class="listtools">
          <label class="sr" for="sort">Sort</label>
          <select id="sort">
            <option value="best">Best trip</option>
            <option value="sun">Most sun</option>
            <option value="near">Closest</option>
            <option value="high">Highest</option>
            <option value="name">Name</option>
          </select>
          <button id="btn-filter" class="chip" type="button"><svg class="ic"><use href="#i-gear"/></svg>Filters</button>
        </div>
      </div>
      <ol id="results" class="results"></ol>
      <footer class="credits" id="credits"></footer>
    </section>

    <section id="pane-map" class="pane pane-map" aria-label="Map">
      <div id="map"></div>
      <div class="mapui mapui-tr">
        <button id="btn-layers" class="mapbtn" type="button" title="Map layers" aria-label="Map layers"><svg class="ic"><use href="#i-layers"/></svg></button>
        <button id="btn-locate" class="mapbtn" type="button" title="Show my position" aria-label="Show my position"><svg class="ic"><use href="#i-locate"/></svg></button>
      </div>
      <div id="layers" class="layers" hidden>
        <h3>Map</h3>
        <div class="seg" id="base-seg">
          <button type="button" data-base="grey">Light</button><button type="button" data-base="color">Topo</button><button type="button" data-base="winter">Winter</button><button type="button" data-base="aerial">Aerial</button>
        </div>
        <label class="check"><input type="checkbox" id="lay-fog"> Sea of fog <small>terrain below the fog top</small></label>
        <label class="check"><input type="checkbox" id="lay-stations"> Measured sunshine <small>MeteoSwiss stations, last 10 min</small></label>
        <label class="check"><input type="checkbox" id="lay-webcams"> Webcams</label>
        <div class="fogctl">
          <label class="check"><input type="checkbox" id="fog-manual"> Set the fog top by hand</label>
          <div class="fogslider"><input type="range" id="fog-top" min="400" max="2600" step="25" value="1000" disabled><output id="fog-top-label">1,000 m</output></div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </section>
  </main>

  <button id="btn-view" class="fab" type="button"><svg class="ic"><use id="view-ic" href="#i-map"/></svg><span id="view-label">Map</span></button>

  <aside id="sheet" class="sheet" hidden aria-label="Place details"></aside>
  <aside id="settings" class="sheet sheet-settings" hidden aria-label="Settings"></aside>
  <div id="toast" class="toast" hidden role="status"></div>
</div>

  U.lerp = (a, b, t) => a + (b - a) * t;
  U.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  U.save = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } };
  U.drop = (key) => { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } };

  /* ---------- geometry ---------- */
  const RAD = Math.PI / 180;
  U.haversine = (lat1, lon1, lat2, lon2) => {
    const p1 = lat1 * RAD, p2 = lat2 * RAD;
    const a = Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(((lon2 - lon1) * RAD) / 2) ** 2;
    return 2 * 6371 * Math.asin(Math.sqrt(a));

    const y = Math.sin((lon2 - lon1) * RAD) * Math.cos(lat2 * RAD);
    const x = Math.cos(lat1 * RAD) * Math.sin(lat2 * RAD) - Math.sin(lat1 * RAD) * Math.cos(lat2 * RAD) * Math.cos((lon2 - lon1) * RAD);
    return (Math.atan2(y, x) / RAD + 360) % 360;

    const y = (E - 2600000) / 1e6, x = (N - 1200000) / 1e6;
    const lam = 2.6779094 + 4.728982 * y + 0.791484 * y * x + 0.1306 * y * x * x - 0.0436 * y * y * y;
    const phi = 16.9023892 + 3.238272 * x - 0.270978 * y * y - 0.002528 * x * x - 0.0447 * y * y * x - 0.014 * x * x * x;

  T.hm = (ms) => { const p = T.parts(ms); return String(p.h).padStart(2, '0') + ':' + String(p.min).padStart(2, '0'); };

  T.dayLabel = (ms, nowMs) => {
    const d0 = T.dayStart(nowMs == null ? Date.now() : nowMs), d = T.dayStart(ms), diff = Math.round((d - d0) / 86400000);

  T.dateLong = (ms) => { const p = T.parts(ms); return p.wd + ' ' + p.d + ' ' + MONTHS[p.m - 1] + ' ' + p.y; };

  U.fmtAltRound = (m, step) => U.fmtAlt(Math.round(m / (step || 50)) * (step || 50));
  U.fmtTemp = (c) => (c == null || isNaN(c) ? '–' : U.units() === 'imperial' ? Math.round(c * 1.8 + 32) + '°F' : Math.round(c) + '°');
  U.fmtDist = (km) => (U.units() === 'imperial' ? (km * 0.621371 < 10 ? (km * 0.621371).toFixed(1) : Math.round(km * 0.621371)) + ' mi' : (km < 10 ? km.toFixed(1) : Math.round(km)) + ' km');

  U.fmtDur = (min) => { min = Math.round(min); if (min < 60) return min + ' min'; const h = Math.floor(min / 60), m = min % 60; return h + ' h' + (m ? ' ' + String(m).padStart(2, '0') : ''); };
  U.fmtSunHours = (min) => { const h = min / 60; return (h >= 9.95 ? Math.round(h) : h.toFixed(1)) + ' h'; };

  /* ---------- colour scale for sunshine (0 = grey fog, 1 = full sun) ---------- */
  const STOPS = [[0, [137, 151, 163]], [0.2, [171, 180, 186]], [0.4, [214, 204, 160]], [0.6, [244, 204, 92]], [0.8, [247, 178, 32]], [1, [245, 158, 0]]];
  U.sunColor = (f) => {
    f = U.clamp(f / 0.9, 0, 1);               // 0.9 is the practical maximum of the calibrated estimate
    for (let i = 1; i < STOPS.length; i++) {
      if (f <= STOPS[i][0]) {
        const a = STOPS[i - 1], b = STOPS[i], t = (f - a[0]) / (b[0] - a[0]);

      }
    }
    return 'rgb(245,158,0)';
  };
  U.sunWord = (f) => (f >= 0.6 ? 'Sunny' : f >= 0.4 ? 'Mostly sunny' : f >= 0.2 ? 'Some sun' : 'No sun');

  /* ---------- fetch with timeout and readable errors ---------- */
  U.getJSON = async (url, opts) => {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), (opts && opts.timeout) || 25000);

      const r = await fetch(url, { signal: ctl.signal, headers: (opts && opts.headers) || undefined });

    } catch (e) {
      if (e.name === 'AbortError') { const err = new Error('The request timed out.'); err.status = 0; throw err; }

    } finally { clearTimeout(timer); }
  };
})();

/* Sonnenseite - bridge to the native app shell (Capacitor, used for the iOS and Android store apps).
   In a normal browser every function here falls back to the matching web API, so the same code runs everywhere. */
(function () {
  'use strict';
  const SS = (window.SS = window.SS || {});
  const C = window.Capacitor;
  const is = !!(C && typeof C.isNativePlatform === 'function' && C.isNativePlatform());
  const N = (SS.native = {
    is: is,
    platform: is && typeof C.getPlatform === 'function' ? C.getPlatform() : 'web',
    version: '1.0.0',
    /* the one place to change when the privacy page or the project moves */
    links: {
      privacy: 'https://valentinovietti34-byte.github.io/sonnenseite/privacy.html',
      support: 'https://github.com/valentinovietti34-byte/sonnenseite/issues',
      source: 'https://github.com/valentinovietti34-byte/sonnenseite',
    },
  });
  document.documentElement.classList.add(is ? 'native' : 'web', 'plat-' + N.platform);

  const plugin = (name) => {
    try { return (is && C.Plugins && C.Plugins[name]) || null; } catch (e) { return null; }
  };
  const quiet = (p) => { if (p && typeof p.catch === 'function') p.catch(() => {}); };

  /* Current position: resolves {lat, lon, accuracy}. Rejects with {code: 1} when the person refused permission. */
  N.getPosition = function () {
    const viaBrowser = () => new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject({ code: 0, message: 'No location service' }); return; }
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy }),
        (e) => reject({ code: e.code, message: e.message }),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
    });
    const G = plugin('Geolocation');
    if (!G || typeof G.getCurrentPosition !== 'function') return viaBrowser();
    const granted = (s) => !!s && (s.location === 'granted' || s.coarseLocation === 'granted');
    return (async () => {
      try {
        let st = await G.checkPermissions();
        if (!granted(st)) st = await G.requestPermissions();
        if (!granted(st)) throw { code: 1, message: 'Location permission refused' };
        const p = await G.getCurrentPosition({ enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
        return { lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy };
      } catch (e) {
        const m = String((e && e.message) || e || '');
        if ((e && e.code === 1) || /denied|refused|permission/i.test(m)) throw { code: 1, message: m };
        return viaBrowser();
      }
    })();
  };

  /* Android back button: fn() returns true when it handled the press (closed a sheet), otherwise the app closes. */
  N.onBack = function (fn) {
    const A = plugin('App');
    if (!A || typeof A.addListener !== 'function') return;
    quiet(A.addListener('backButton', () => { if (!fn()) quiet(A.exitApp && A.exitApp()); }));
  };

  /* Status bar text colour follows the app theme (light text on a dark header, dark text on a light one). */
  N.setBars = function (dark) {
    const B = plugin('SystemBars') || plugin('StatusBar');
    if (B && typeof B.setStyle === 'function') quiet(B.setStyle({ style: dark ? 'DARK' : 'LIGHT' }));
  };
})();

<script>
/* Sonnenseite - solar position and terrain shading.
   Solar position follows the NOAA algorithm (same maths as tools/sunpos.py).
   Each place carries a 360 degree terrain horizon (2 degree steps) computed from an elevation model at build time;
   the sun counts as visible when its apparent altitude is above that horizon. */
(function () {
  'use strict';
  const SS = (window.SS = window.SS || {});
  const RAD = Math.PI / 180;
  const S = (SS.sun = {});

  S.position = function (ms, lat, lon) {
    const jd = ms / 86400000 + 2440587.5, T = (jd - 2451545.0) / 36525.0;
    const L0 = ((280.46646 + T * (36000.76983 + T * 0.0003032)) % 360 + 360) % 360;
    const M = (357.52911 + T * (35999.05029 - 0.0001537 * T)) * RAD;
    const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
    const C = Math.sin(M) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * M) * (0.019993 - 0.000101 * T) + Math.sin(3 * M) * 0.000289;
    const omega = (125.04 - 1934.136 * T) * RAD;
    const lam = (L0 + C - 0.00569 - 0.00478 * Math.sin(omega)) * RAD;
    const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
    const eps = (eps0 + 0.00256 * Math.cos(omega)) * RAD;
    const decl = Math.asin(Math.sin(eps) * Math.sin(lam));
    const y = Math.tan(eps / 2) ** 2, L0r = L0 * RAD;
    const eot = (4 * (y * Math.sin(2 * L0r) - 2 * e * Math.sin(M) + 4 * e * y * Math.sin(M) * Math.cos(2 * L0r) - 0.5 * y * y * Math.sin(4 * L0r) - 1.25 * e * e * Math.sin(2 * M))) / RAD;
    const minutes = ((ms % 86400000) + 86400000) % 86400000 / 60000;
    const tst = (((minutes + eot + 4 * lon) % 1440) + 1440) % 1440;
    const ha = (tst / 4 - 180) * RAD, la = lat * RAD;
    const cz = Math.max(-1, Math.min(1, Math.sin(la) * Math.sin(decl) + Math.cos(la) * Math.cos(decl) * Math.cos(ha)));
    let alt = 90 - Math.acos(cz) / RAD;
    const az = ((Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(la) - Math.tan(decl) * Math.cos(la)) / RAD + 180) % 360 + 360) % 360;
    let r;                                           // atmospheric refraction, arc seconds
    if (alt > 85) r = 0;
    else if (alt > 5) { const t = Math.tan(alt * RAD); r = 58.1 / t - 0.07 / (t * t * t) + 0.000086 / (t * t * t * t * t); }
    else if (alt > -0.575) r = 1735 + alt * (-518.2 + alt * (103.4 + alt * (-12.79 + alt * 0.711)));
    else r = -20.772 / Math.tan(alt * RAD);
    alt += r / 3600;
    return { alt: alt, az: az };
  };

  /* horizon strings: one character per 2 degrees of azimuth, angle = (code - 33) / 2 - 3 degrees */
  S.decodeHorizon = function (str) {
    const a = new Float32Array(180);
    for (let i = 0; i < 180; i++) a[i] = (str.charCodeAt(i) - 33) / 2 - 3;
    return a;
  };
  S.horizonAt = function (hz, az) {
    const x = (((az % 360) + 360) % 360) / 2, i = Math.floor(x) % 180, f = x - Math.floor(x);
    return hz[i] * (1 - f) + hz[(i + 1) % 180] * f;
  };
  S.visible = function (hz, ms, lat, lon) {
    const p = S.position(ms, lat, lon);
    return p.alt > Math.max(hz ? S.horizonAt(hz, p.az) : 0, 0);
  };

  /* Fraction of the hour starting at ms during which the sun clears the terrain (10 samples). Also reports night. */
  S.hourFraction = function (hz, ms, lat, lon) {
    let vis = 0, up = 0;
    for (let k = 0; k < 10; k++) {
      const p = S.position(ms + 180000 + k * 360000, lat, lon);
      if (p.alt > 0) { up++; if (p.alt > Math.max(S.horizonAt(hz, p.az), 0)) vis++; }
    }
    return { terr: vis / 10, up: up / 10 };
  };

  /* First and last moment of direct sun on a given local day, with and without terrain (4 minute resolution). */
  S.dayWindow = function (hz, dayStartMs, lat, lon) {
    let first = null, last = null, rise = null, set = null, minutes = 0, astro = 0;
    for (let t = dayStartMs; t < dayStartMs + 86400000; t += 240000) {
      const p = S.position(t + 120000, lat, lon);
      if (p.alt > 0) {
        astro += 4; if (rise == null) rise = t; set = t + 240000;
        if (p.alt > Math.max(S.horizonAt(hz, p.az), 0)) { minutes += 4; if (first == null) first = t; last = t + 240000; }
      }
    }
    return { first: first, last: last, rise: rise, set: set, minutes: minutes, astro: astro };
  };

  /* Sun track for a day: points every stepMin minutes while the sun is above -1 degree. */
  S.track = function (dayStartMs, lat, lon, stepMin) {
    const out = [];
    for (let t = dayStartMs; t <= dayStartMs + 86400000; t += (stepMin || 10) * 60000) {
      const p = S.position(t, lat, lon);
      if (p.alt > -1) out.push({ ms: t, alt: p.alt, az: p.az });
    }
    return out;
  };
})();

<script>
/* Sonnenseite - data engine.
   Loads the forecast (Open-Meteo), live measurements (MeteoSwiss open data), drive times (OSRM) and timetable
   connections (transport.opendata.ch), and turns them into an hourly sunshine estimate for every place.

   How sunshine is estimated (calibrated against 26,000 station-hours of MeteoSwiss sunshine measurements):
     sun = terrain x 0.9 x (1 - 0.9 L) x (1 - 0.6 M^0.75) x (1 - 0.2 H^3)
   with L, M, H the low, mid and high cloud fractions and "terrain" the share of the hour the sun clears the
   mountains. The weather model's own "sunshine duration" is not used: it overstated measured sun about twofold.

   Fog top: weather-model cells are about 2 km wide, so a hill that pokes out of the fog often sits in a cell that
   is still inside it. For every hour the engine fits the regional profile "low cloud versus altitude" from all
   places within 40 km (an isotonic fit over the model's cell heights) and lifts a hill out of the fog only when a
   cell at or below its real altitude is already clear. */
(function () {
  'use strict';
  const SS = window.SS, U = SS.util, T = SS.tz, Sun = SS.sun;
  const E = (SS.engine = {});

  const API_VARS = ['cloud_cover_low', 'cloud_cover_mid', 'cloud_cover_high', 'temperature_2m', 'wind_gusts_10m', 'precipitation', 'visibility', 'relative_humidity_2m', 'snow_depth'];
  const KEYS = ['low', 'mid', 'high', 'temp', 'gust', 'precip', 'vis', 'rh', 'snow'];
  /* cache quantisation: value -> 0..250 (255 = missing) */
  const Q = {
    low: [1, 0], mid: [1, 0], high: [1, 0], rh: [1, 0], temp: [2, 60], gust: [1, 0], precip: [10, 0], vis: [1 / 300, 0], snow: [50, 0],
  };
  const FC_KEY = 'ss.forecast.v2';
  const FC_MAX_AGE = 60 * 60000;

  E.MODELS = [
    { id: 'best_match', name: 'Best match', note: 'ICON-D2 (2 km) for two days, then ICON-EU. Recommended.' },
    { id: 'meteoswiss_icon_ch2', name: 'MeteoSwiss ICON-CH2', note: '2 km Swiss model, 5 days.' },
    { id: 'meteoswiss_icon_ch1', name: 'MeteoSwiss ICON-CH1', note: '1 km Swiss model, 33 hours only.' },
    { id: 'icon_d2', name: 'DWD ICON-D2', note: '2 km, 48 hours.' },
    { id: 'meteofrance_arome_france_hd', name: 'Météo-France AROME HD', note: '1.5 km, 2 days.' },
    { id: 'ecmwf_ifs025', name: 'ECMWF IFS', note: 'Global 25 km model; smooths out fog. For comparison.' },
  ];

  /* ------------------------------------------------------------------ places */
  E.init = function () {
    const P = (E.places = window.SS_PLACES.map((p, i) => Object.assign({}, p, { i: i, hzArr: Sun.decodeHorizon(p.hz) })));
    E.byId = {};
    P.forEach((p) => { E.byId[p.id] = p; });
    /* ladder neighbours within 40 km, sorted by model-cell height */
    P.forEach((p) => {
      const nb = [];
      P.forEach((q) => {
        if (q === p) return;
        const d = U.haversine(p.la, p.lo, q.la, q.lo);
        if (d < 40) nb.push({ j: q.i, z: q.zc, w: Math.exp(-d / 20) });
      });
      nb.sort((a, b) => a.z - b.z);
      p.nb = nb;
    });

    Object.keys(E.stationsMeta).forEach((id) => { E.stationsMeta[id].hzArr = Sun.decodeHorizon(E.stationsMeta[id].hz); });
    E.webcams = window.SS_WEBCAMS || [];
    E.drive = null;
  };

  /* ------------------------------------------------------------------ forecast */
  function encode(arr, key) {
    const [mul, off] = Q[key];
    let s = '';

      const v = arr[i];
      s += String.fromCharCode(0x100 + (v !== v ? 255 : U.clamp(Math.round((v + off) * mul), 0, 250)));
    }
    return s;
  }
  function decode(str, key) {
    const [mul, off] = Q[key], a = new Float32Array(str.length);
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i) - 0x100; a[i] = c === 255 ? NaN : c / mul - off; }
    return a;
  }

    const base = archive ? 'https://historical-forecast-api.open-meteo.com/v1/forecast' : 'https://api.open-meteo.com/v1/forecast';
    const q = [
      'latitude=' + chunk.map((p) => p.la.toFixed(4)).join(','),
      'longitude=' + chunk.map((p) => p.lo.toFixed(4)).join(','),
      'elevation=' + chunk.map((p) => p.e).join(','),
      'hourly=' + API_VARS.join(','),
      'timeformat=unixtime', 'timezone=GMT', 'wind_speed_unit=kmh',
    ];
    if (archive) {
      const d0 = Date.parse(archive + 'T00:00:00Z');
      q.push('start_date=' + archive, 'end_date=' + new Date(d0 + 2 * 86400000).toISOString().slice(0, 10));
    } else {
      q.push('forecast_days=' + (days || 4));
    }
    if (model && model !== 'best_match') q.push('models=' + model);
    return base + '?' + q.join('&');
  }

  E._forecastUrl = forecastUrl;

  function fromCache(c) {
    const fc = { t0: c.t0, n: c.n, fetched: c.fetched, model: c.model, archive: c.archive || null, cached: true };
    KEYS.forEach((k) => { fc[k] = decode(c.vars[k], k); });
    return fc;
  }

  /* Returns the forecast object and computes derived fields. opts: {model, archive, force} */
  E.loadForecast = async function (opts) {
    opts = opts || {};
    const model = opts.model || 'best_match', archive = opts.archive || null;
    const cached = U.load(FC_KEY, null);
    const usable = cached && cached.sig === placeSignature() && cached.model === model && (cached.archive || null) === archive;
    if (usable && !opts.force && (archive || Date.now() - cached.fetched < FC_MAX_AGE)) {
      E.fc = fromCache(cached); compute(); return E.fc;

    const b = BASES[name] || BASES.grey;
    if (base) map.removeLayer(base);
    base = L.tileLayer(WMTS + b.id + '/default/current/3857/{z}/{x}/{y}.jpeg', { attribution: ATTR, maxNativeZoom: 18, maxZoom: 18, className: b.cls || '', bounds: [[45.6, 5.7], [47.95, 10.7]], zIndex: 2 }).addTo(map);
  };
  M.setLayer = function (name, on) {
    const g = name === 'fog' ? fog : name === 'stations' ? gStations : gWebcams;
    if (on && !map.hasLayer(g)) g.addTo(map);
    if (!on && map.hasLayer(g)) map.removeLayer(g);
    if (name === 'webcams' && on && !gWebcams._built) buildWebcams();
  };
  M.setFog = function (fn) { M.fogFn = fn; if (map.hasLayer(fog)) fog.repaint(); };

  /* colour every place marker for the selected hour. info(p) -> {sun, state, dim, fav, sel} */
  M.paintPlaces = function (info) {
    E.places.forEach((p) => {
      const el = markers[p.id].getElement();
      if (!el) return;
      const d = el.firstChild, s = info(p);
      d.style.background = s.state === 'night' ? 'var(--night)' : s.state === 'shade' ? 'var(--shade)' : s.state === 'nodata' ? '#c9d1d8' : U.sunColor(s.sun);
      d.classList.toggle('dim', !!s.dim); d.classList.toggle('fav', !!s.fav); d.classList.toggle('sel', !!s.sel);
    });
  };

  M.paintStations = function () {
    gStations.clearLayers();
    if (!E.obs) return;
    E.obs.list.forEach((s) => {
      if (s.sun == null || !s.canSee) return;            /* no reading is possible while the sun is below the station's skyline */
      const mk = L.marker([s.la, s.lo], { icon: L.divIcon({ className: '', html: '<div class="st' + (s.canSee ? '' : ' blind') + '" style="background:' + (s.canSee ? U.sunColor((s.sun / 10) * 0.9) : '#c9d1d8') + '"></div>', iconSize: [0, 0] }), title: s.n, zIndexOffset: -500 });
      mk.bindPopup(() => '<b>' + U.esc(s.n) + '</b><br><span class="muted">MeteoSwiss station · ' + U.fmtAlt(s.e) + '</span><br>'
        + (s.canSee ? 'Sunshine: <b>' + Math.round(s.sun) + ' of 10 min</b>' : 'Sun not visible from here right now')
        + (s.t != null ? '<br>Temperature: ' + U.fmtTemp(s.t) : '') + (s.rh != null ? ' · Humidity: ' + Math.round(s.rh) + '%' : '')
        + '<br><span class="muted">Measured ' + SS.tz.hm(s.ts) + '</span>');
      mk.addTo(gStations);
    });
  };

  function buildWebcams() {
    gWebcams._built = true;
    E.webcams.forEach((w) => {
      const mk = L.marker([w.la, w.lo], { icon: L.divIcon({ className: '', html: '<div class="wc"><svg class="ic"><use href="#i-cam"/></svg></div>', iconSize: [0, 0] }), title: w.n, zIndexOffset: -200 });
      mk.bindPopup(() => '<b>' + U.esc(w.n) + '</b><br><span class="muted">Webcam · ' + U.fmtAlt(w.e) + '</span>'
        + (w.i ? '<img src="' + U.esc(w.i) + '" alt="Latest image from ' + U.esc(w.n) + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : '<br>')
        + '<a class="pop-btn" href="' + U.esc(w.u) + '" target="_blank" rel="noopener">Open live webcam</a>', { minWidth: 220 });
      mk.addTo(gWebcams);
    });
  }

  M.setHome = function (home) {
    if (homeMk) map.removeLayer(homeMk);
    homeMk = L.marker([home.lat, home.lon], { icon: L.divIcon({ className: '', html: '<div class="homepin"><svg viewBox="0 0 24 24"><use href="#i-pin"/></svg></div>', iconSize: [0, 0] }), title: 'Start: ' + home.name, zIndexOffset: 5000, interactive: false }).addTo(map);
  };
  M.setMe = function (lat, lon, acc) {
    if (!meMk) { meMk = L.marker([lat, lon], { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [0, 0] }), zIndexOffset: 6000, interactive: false }).addTo(map); meCircle = L.circle([lat, lon], { radius: acc || 30, weight: 1, color: '#2B7BD1', fillOpacity: 0.12, interactive: false }).addTo(map); }
    else { meMk.setLatLng([lat, lon]); meCircle.setLatLng([lat, lon]); meCircle.setRadius(acc || 30); }
  };
  M.showRoute = function (line) {
    M.clearRoute();
    routeLine = L.polyline(line, { color: '#2B7BD1', weight: 5, opacity: 0.85, lineCap: 'round' }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
  };
  M.clearRoute = function () { if (routeLine) { map.removeLayer(routeLine); routeLine = null; } };
  M.focus = function (p, zoom) { map.setView([p.la, p.lo], Math.max(map.getZoom(), zoom || 11), { animate: true }); };
  M.fitAround = function (home, km) {
    const dLat = km / 111, dLon = km / (111 * Math.cos((home.lat * Math.PI) / 180));
    map.fitBounds([[home.lat - dLat, home.lon - dLon], [home.lat + dLat, home.lon + dLon]]);
  };
  M.popup = function (ll, html, onClick) {
    const div = document.createElement('div');
    div.innerHTML = html;
    if (onClick) div.addEventListener('click', onClick);
    if (!M._pop) M._pop = L.popup({ maxWidth: 270, autoPanPadding: [40, 40] });
    M._pop.setLatLng(ll).setContent(div).openOn(map);
  };
  M.closePopup = function () { if (map) map.closePopup(); };
  M.invalidate = function () { if (map) map.invalidateSize(); };
})();

</script>
<script>
/* Sonnenseite - interface rendering: fog brief, ranked list, place details, settings. */
(function () {
  'use strict';
  const SS = window.SS, U = SS.util, T = SS.tz, E = SS.engine, Sun = SS.sun;
  const UI = (SS.ui = {});
  const $ = U.$, esc = U.esc;
  const ic = (n) => '<svg class="ic"><use href="#i-' + n + '"/></svg>';
  const KIND = { peak: 'Summit', hill: 'Viewpoint', village: 'Mountain village', pass: 'Pass', town: 'Town' };
  const ACCESS = { cable: 'cable car', funi: 'funicular', cog: 'mountain railway', walk: 'walk' };
  const CONF = { likely: 'Sun likely', maybe: '50/50', unlikely: 'Sun unlikely' };
  const CONF_LONG = { likely: 'Sun likely: the forecast is clear-cut here.', maybe: '50/50: this spot is close to the top of the fog, or the cloud forecast is borderline. Check the webcam before you go.', unlikely: 'Sun unlikely here on this day.' };
  const CAMWORD = { blue: 'blue sky', fog: 'fog or cloud' };
  const flatHz = new Float32Array(180);
  let toastTimer = null;

  UI.toast = function (msg, ms) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms || 3200);
  };
  UI.banner = function (msg, label, fn) {
    const b = $('#banner');
    if (!msg) { b.hidden = true; return; }
    b.innerHTML = ic('warn') + '<span>' + esc(msg) + '</span>' + (label ? '<button type="button">' + esc(label) + '</button>' : '');
    b.hidden = false;
    if (label) b.querySelector('button').onclick = fn;
  };

  const stateIcon = (o) => (!o || o.state === 'nodata' ? 'cloud' : o.state === 'night' ? 'moon' : o.state === 'shade' ? 'shade' : o.sun >= 0.4 ? 'sun' : o.leff >= 0.6 ? 'fog' : 'cloud');
  const stateBg = (o) => (!o || o.state === 'nodata' ? '#c9d1d8' : o.state === 'night' ? 'var(--night)' : o.state === 'shade' ? 'var(--shade)' : U.sunColor(o.sun));
  const cell = (o, cur) => {
    const cls = (o.state === 'night' ? 'ni' : o.state === 'shade' ? 'sh' : o.state === 'nodata' ? 'na' : '') + (cur ? ' cur' : '');
    return '<i' + (cls ? ' class="' + cls.trim() + '"' : '') + (cls.indexOf('n') === 0 || cls.indexOf('sh') === 0 ? '' : ' style="background:' + U.sunColor(o.sun) + '"') + '></i>';
  };
  function accessText(p, tr) {
    const drive = (tr.exact ? '' : '~') + U.fmtDur(tr.drive);
    if (p.a.length === 3) return drive + ' + ' + p.a[2] + ' min ' + ACCESS[p.a[0]];
    return drive + (p.a[0] === 'train' ? ' by car' : ' by car');
  }
  /* daylight hours (local) for the strip, from the flat-horizon sunrise and sunset at the starting point */
  function lightRange(dayStart) {
    const h = SS.app.home, w = Sun.dayWindow(flatHz, dayStart, h.lat, h.lon);
    if (w.rise == null) return [7, 18];
    return [Math.max(0, T.hour(w.rise)), Math.min(23, T.hour(w.set - 60000))];
  }

  /* ------------------------------------------------------------------ day chips and hour slider */
  UI.renderWhen = function () {
    const A = SS.app, days = E.days(), now = E.now();
    $('#days').innerHTML = days.map((d) => {
      const est = E.atPoint(A.home.lat, A.home.lon, A.home.ele, E.hourIndex(d + 12 * 3600000));
      const sel = d === A.sel.dayStart;
      return '<button type="button" class="day" role="tab" aria-selected="' + sel + '" data-day="' + d + '"><b>' + esc(T.dayLabel(d + 43200000, now)) + '</b><small>' + esc(T.date(d + 43200000).replace(/^\w+ /, '')) + (est && est.sun === est.sun ? ' · ' + (est.sun >= 0.45 ? 'sun' : est.low >= 0.6 ? 'fog' : 'cloud') : '') + '</small></button>';
    }).join('');
    const hr = $('#hour');
    hr.value = String(T.hour(A.sel.atMs));
    $('#hour-label').textContent = T.hm(A.sel.atMs);
    $('#home-name').textContent = A.home.name;
  };

  /* ------------------------------------------------------------------ fog brief */
  function ladderSvg(rows, prof, dayStart) {
    const A = SS.app, W = 400, H = 196, x0 = 44, x1 = 392, y0 = 14, y1 = 164;
    const maxT = Math.min(A.state.maxTravel, 240);
    const pts = rows.filter((r) => r.travel.total === r.travel.total && r.travel.total <= maxT);
    let zMax = 1500;
    pts.forEach((r) => { if (r.p.e > zMax) zMax = r.p.e; });
    zMax = Math.min(3400, Math.ceil((zMax + 100) / 500) * 500);
    const zMin = Math.floor(Math.min(A.home.ele, 400) / 100) * 100 - 100;
    const X = (m) => x0 + (m / maxT) * (x1 - x0), Y = (z) => y1 - ((U.clamp(z, zMin, zMax) - zMin) / (zMax - zMin)) * (y1 - y0);
    let fogLabel = '';
    let s = '<svg class="ladder" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Places by travel time and altitude, with the fog layer">';
    s += '<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fog)" stop-opacity=".75"/><stop offset="1" stop-color="var(--fog)" stop-opacity=".32"/></linearGradient></defs>';
    s += '<rect x="' + x0 + '" y="' + y0 + '" width="' + (x1 - x0) + '" height="' + (y1 - y0) + '" fill="var(--surface-2)" rx="4"/>';
    if (prof.state === 'fog') {
      s += '<rect x="' + x0 + '" y="' + Y(prof.top) + '" width="' + (x1 - x0) + '" height="' + (y1 - Y(prof.top)) + '" fill="url(#fg)"/>';
      s += '<rect x="' + x0 + '" y="' + Y(prof.hi) + '" width="' + (x1 - x0) + '" height="' + Math.max(1, Y(prof.lo) - Y(prof.hi)) + '" fill="var(--fog)" opacity=".28"/>';
      fogLabel = '<text x="' + (x0 + 6) + '" y="' + (Y(prof.hi) - 5) + '" class="lbl">fog top ' + esc(U.fmtAltRound(prof.lo)) + ' to ' + esc(U.fmtAltRound(prof.hi)) + '</text>';
    } else if (prof.state === 'deck') {
      s += '<rect x="' + x0 + '" y="' + Y(Math.min(zMax, prof.lo + 150)) + '" width="' + (x1 - x0) + '" height="' + (y1 - Y(Math.min(zMax, prof.lo + 150))) + '" fill="url(#fg)"/>';
    }
    for (let z = Math.ceil((zMin + 1) / 500) * 500; z <= zMax; z += 500) s += '<line class="axis" x1="' + x0 + '" x2="' + x1 + '" y1="' + Y(z) + '" y2="' + Y(z) + '" stroke-dasharray="2 4"/><text x="' + (x0 - 5) + '" y="' + (Y(z) + 3.5) + '" text-anchor="end">' + esc(U.units() === 'imperial' ? Math.round(z * 3.28084 / 100) * 100 : z) + '</text>';
    const stepT = maxT > 150 ? 60 : 30;
    for (let m = stepT; m <= maxT; m += stepT) s += '<text x="' + X(m) + '" y="' + (y1 + 13) + '" text-anchor="' + (m + stepT > maxT && X(m) > x1 - 22 ? 'end' : 'middle') + '">' + (m % 60 === 0 ? m / 60 + ' h' : m + ' min') + '</text>';
    s += '<text x="' + x0 + '" y="' + (H - 4) + '">Travel time from ' + esc(A.home.name) + ' →</text><text x="' + x0 + '" y="' + (y0 - 4) + '">' + (U.units() === 'imperial' ? 'ft' : 'm') + '</text>';
    /* points: low sun first so sunny dots end up on top */
    const order = pts.slice().sort((a, b) => (a.now ? a.now.sun || 0 : 0) - (b.now ? b.now.sun || 0 : 0));
    order.forEach((r) => {
      s += '<circle class="pt" data-id="' + r.p.id + '" cx="' + X(r.travel.total).toFixed(1) + '" cy="' + Y(r.p.e).toFixed(1) + '" r="' + (r.p.k === 'town' ? 3.4 : 4.6) + '" fill="' + stateBg(r.now) + '" stroke="var(--surface)" stroke-width="1.2"><title>' + esc(r.p.n + ' · ' + U.fmtAlt(r.p.e)) + '</title></circle>';
    });
    /* label the best few without overlaps */
    const placed = [];
    rows.slice(0, 40).forEach((r) => {
      if (placed.length >= 6 || !(r.travel.total <= maxT) || !r.now || !(r.sunMin >= 45)) return;
      const cx = X(r.travel.total), cy = Y(r.p.e), w = r.p.n.length * 5.6 + 8, right = cx + 8 + w < x1;
      const bx = right ? cx + 7 : cx - 7 - w, by = cy - 6;
      if (placed.some((b) => bx < b[0] + b[2] && bx + w > b[0] && by < b[1] + 13 && by + 13 > b[1])) return;
      placed.push([bx, by, w]);
      s += '<text class="lbl pt" data-id="' + r.p.id + '" x="' + (right ? cx + 8 : cx - 8) + '" y="' + (cy + 3.5) + '"' + (right ? '' : ' text-anchor="end"') + '>' + esc(r.p.n) + '</text>';
    });
    s += fogLabel + '<path d="M' + (x0 - 1) + ' ' + Y(A.home.ele) + 'l-9 -5v10z" fill="var(--sky)"><title>Your starting point</title></path>';
    return s + '</svg>';
  }

  UI.renderBrief = function () {
    const A = SS.app, box = $('#brief');
    if (!E.fc) { box.innerHTML = '<div class="brief-head"><div class="eyebrow">Loading forecast</div><h2>Looking for the sun…</h2><p>Fetching the forecast for ' + E.places.length + ' places and the latest MeteoSwiss measurements.</p></div>'; return; }
    const h = E.hourIndex(A.sel.atMs), prof = E.profile(A.home.lat, A.home.lon, h), est = E.atPoint(A.home.lat, A.home.lon, A.home.ele, h);
    const now = E.now(), today = T.dayStart(now) === A.sel.dayStart, live = today && !E.fc.archive && Math.abs(A.sel.atMs - now) < 5400000;
    const when = (today ? '' : T.dayLabel(A.sel.dayStart + 43200000, now) + ' ') + T.hm(A.sel.atMs);
    let head, sub;
    const under = prof.state === 'fog' && A.home.ele < prof.top;
    if (prof.state === 'fog') {
      head = 'Fog up to about ' + U.fmtAltRound(prof.top);
      sub = 'Around <b>' + esc(A.home.name) + '</b> at ' + when + ' the low cloud ends between ' + U.fmtAltRound(prof.lo) + ' and ' + U.fmtAltRound(prof.hi) + '. ' + (under ? 'You are under it; above that line the sky is open.' : 'You are above it.');
    } else if (prof.state === 'deck') {
      head = 'Low cloud at every height';
      sub = 'Around <b>' + esc(A.home.name) + '</b> at ' + when + ' there is no clear layer up to ' + U.fmtAltRound(prof.lo) + '. Going up will not help nearby; look further away.';
    } else if (prof.state === 'patchy') {
      head = 'Patchy low cloud';
      sub = 'Around <b>' + esc(A.home.name) + '</b> at ' + when + ' the low cloud is broken. Sun and grey take turns.';
    } else if (prof.state === 'clear') {
      head = est && est.up ? (est.sun >= 0.5 ? 'No fog. The sun is out' : 'No fog, but cloud higher up') : 'No fog tonight';
      sub = 'Around <b>' + esc(A.home.name) + '</b> at ' + when + (est && est.up ? ' the lowlands are free of low cloud.' : ' the air is clear below the cloud line.');
    } else { head = 'No forecast for this hour'; sub = 'Pick another hour or day.'; }
    let measured = '';
    if (live && E.obs) {
      const op = E.obsProfile(A.home.lat, A.home.lon), t = T.hm(op.ts || E.obs.ts);
      if (op.state === 'fog') measured = 'Measured ' + t + ': sunshine from ' + U.fmtAlt(op.hi) + ' (' + esc(op.hiName) + '), grey up to ' + U.fmtAlt(op.lo) + ' (' + esc(op.loName) + ').';
      else if (op.state === 'deck') measured = 'Measured ' + t + ': no sunshine at any station nearby, up to ' + U.fmtAlt(op.lo) + ' (' + esc(op.loName) + ').';
      else if (op.state === 'clear') measured = 'Measured ' + t + ': the stations around you report sunshine.';
      else if (op.state === 'patchy') measured = 'Measured ' + t + ': sun and cloud mixed at the low stations.';
    }
    const rows = A.ranked || [];
    const best = rows.find((r) => !r.closed && !r.liftClosed && r.day.conf !== 'unlikely' && r.sunMin >= (today ? 45 : 90));
    let bb = '';
    if (best) {
      const tr = best.travel;
      bb = '<button type="button" class="bestbet" data-id="' + best.p.id + '">' + ic('sun') + '<span><b>' + esc(best.p.n) + ' · ' + U.fmtAlt(best.p.e) + '</b><small>' + (tr.total === tr.total ? U.fmtDur(tr.total) + ' away · ' : '') + U.fmtSunHours(best.sunMin) + ' of sun' + (today ? ' after you arrive' : '') + (best.day.fogBelowHours ? ' · above the fog' : '') + '</small></span><span class="go">Details</span></button>';
    } else if (rows.length) {
      bb = '<div class="bestbet">' + ic('cloud') + '<span><b>No real sunshine within reach ' + (today ? 'for the rest of today' : 'that day') + '</b><small>Try another day, or raise the travel limit in Filters.</small></span></div>';
    }
    const T1 = A.tomorrow;
    const tm = T1 && today ? '<button type="button" class="tomorrow" data-day="' + T1.dayStart + '">' + ic('sun') + '<span><b>Tomorrow: ' + esc(T1.p.n) + '</b><small>' + CONF[T1.conf] + ' · about ' + U.fmtSunHours(T1.sunMin) + ' of sun' + (T1.total === T1.total ? ' · ' + U.fmtDur(T1.total) + ' away' : '') + '</small></span><span class="go">Show</span></button>' : '';
    box.innerHTML = '<div class="brief-head"><div class="eyebrow">' + (E.fc.archive ? 'Replay of ' + esc(T.dateLong(A.sel.atMs)) : live ? 'Right now' : 'Forecast') + ' · ' + esc(A.home.name) + ' ' + U.fmtAlt(A.home.ele) + '</div><h2>' + esc(head) + '</h2><p>' + sub + '</p>'
      + (measured ? '<p class="measured"><span class="dot"></span><span>' + measured + '</span></p>' : '') + '</div>' + ladderSvg(rows, prof, A.sel.dayStart) + bb + tm;
  };

  /* ------------------------------------------------------------------ list */
  UI.renderList = function () {
    const A = SS.app, ol = $('#results');
    if (!E.fc) { ol.innerHTML = '<li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>'; return; }
    const rows = A.ranked || [], now = E.now(), today = T.dayStart(now) === A.sel.dayStart;
    const [ha, hb] = lightRange(A.sel.dayStart), curH = T.hour(A.sel.atMs);
    $('#list-title').textContent = today ? 'Where the sun is today' : 'Where the sun is ' + (T.dayLabel(A.sel.dayStart + 43200000, now) === 'Tomorrow' ? 'tomorrow' : 'on ' + T.date(A.sel.dayStart + 43200000));
    if (!rows.length) { ol.innerHTML = '<li class="empty">No places match your filters. Open Filters and widen the travel time or altitude range.</li>'; return; }
    const shown = rows.slice(0, A.listLimit || 40);
    ol.innerHTML = shown.map((r) => {
      const p = r.p, o = r.now, tags = [];
      tags.push('<span class="tag t-conf t-' + r.day.conf + '">' + CONF[r.day.conf] + '</span>');
      if (r.day.fogBelowHours) tags.push('<span class="tag t-above">' + ic('sun') + 'Above the fog</span>');
      if (p.a.length === 3) tags.push('<span class="tag">' + ic(p.a[0] === 'walk' ? 'walk' : p.a[0] === 'cable' ? 'cable' : 'train') + p.a[2] + ' min ' + ACCESS[p.a[0]] + '</span>');
      if (r.closed) tags.push('<span class="tag t-warn">' + ic('warn') + 'Usually closed in winter</span>');
      if (r.liftClosed) tags.push('<span class="tag t-warn">' + ic('warn') + 'No lift departures in the timetable</span>');
      else if (r.lift && r.lift.n > 0 && r.lift.last) tags.push('<span class="tag t-meas">' + ic('cable') + 'Lift running, last ' + T.hm(r.lift.last) + '</span>');
      const cr = today ? E.camResult(E.bestCam(p)) : null;
      if (cr && cr.ts && Date.now() - cr.ts < 50 * 60000 && CAMWORD[cr.state]) tags.push('<span class="tag t-cam-' + cr.state + '">' + ic('cam') + 'Webcam ' + T.hm(cr.ts) + ': ' + CAMWORD[cr.state] + '</span>');
      if (today && E.obs && !E.fc.archive) { const s = E.nearestStation(p.la, p.lo, p.e, 6, 150); if (s && s.canSee && s.sun >= 7) tags.push('<span class="tag t-meas">Measured sunny nearby</span>'); }
      if (A.state.favs[p.id]) tags.push('<span class="tag">' + ic('star') + 'Saved</span>');
      let strip = '';
      for (let k = ha; k <= hb; k++) strip += cell(r.day.hours[k], k === curH);
      return '<li><button type="button" class="row' + (r.closed || r.liftClosed ? ' closed' : '') + '" data-id="' + p.id + '">'
        + '<span class="badge-sun" style="background:' + stateBg(o) + '">' + ic(stateIcon(o)) + '</span>'
        + '<span class="row-main"><b>' + esc(p.n) + '</b><small>' + U.fmtAlt(p.e) + ' · ' + esc(p.c) + (r.travel.total === r.travel.total ? ' · ' + (r.travel.exact ? '' : '~') + U.fmtDur(r.travel.total) + (r.travel.mode === 'train' ? ' by train' : '') : '') + '</small></span>'
        + '<span class="row-sun"><b class="num">' + U.fmtSunHours(r.sunMin) + '</b><small>' + (today ? 'sun left' : 'of sun') + '</small></span>'
        + '<span class="strip" title="Hour by hour, ' + ha + ':00 to ' + (hb + 1) + ':00">' + strip + '</span>'
        + (tags.length ? '<span class="tags">' + tags.join('') + '</span>' : '') + '</button></li>';
    }).join('') + (rows.length > shown.length ? '<li><button type="button" class="btn block" id="more">Show ' + Math.min(40, rows.length - shown.length) + ' more places</button></li>' : '');
  };

  UI.renderLegend = function () {

  /* ------------------------------------------------------------------ place sheet */
  function sunPathSvg(p, dayStart) {
    const W = 400, H = 210, x0 = 8, x1 = 392, y0 = 10, y1 = 178, A0 = 45, A1 = 315, EMAX = 68;
    const X = (az) => x0 + ((az - A0) / (A1 - A0)) * (x1 - x0), Y = (alt) => y1 - (U.clamp(alt, -2, EMAX) / EMAX) * (y1 - y0);
    let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Sun path over the terrain horizon"><rect x="' + x0 + '" y="' + y0 + '" width="' + (x1 - x0) + '" height="' + (y1 - y0) + '" fill="var(--surface-2)" rx="4"/>';
    for (let a = 15; a <= 60; a += 15) s += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + Y(a) + '" y2="' + Y(a) + '" stroke="var(--line)" stroke-dasharray="2 4"/><text x="' + (x0 + 3) + '" y="' + (Y(a) - 2) + '">' + a + '°</text>';
    const seasonal = (m, d, col) => {
      const y = T.parts(dayStart).y, ds = T.dayStart(Date.UTC(y, m - 1, d, 12));
      const tr = Sun.track(ds, p.la, p.lo, 15).filter((q) => q.az >= A0 && q.az <= A1);
      return tr.length ? '<polyline fill="none" stroke="' + col + '" stroke-width="1" stroke-dasharray="3 3" points="' + tr.map((q) => X(q.az).toFixed(1) + ',' + Y(q.alt).toFixed(1)).join(' ') + '"/>' : '';
    };
    s += seasonal(6, 21, 'var(--muted)') + seasonal(12, 21, 'var(--muted)');
    const tr = Sun.track(dayStart, p.la, p.lo, 5).filter((q) => q.az >= A0 && q.az <= A1);
    let seg = [], vis = null;
    const flush = () => { if (seg.length > 1) s += '<polyline fill="none" stroke="' + (vis ? 'var(--sun)' : 'var(--shade)') + '" stroke-width="' + (vis ? 3.2 : 1.8) + '" stroke-linecap="round" points="' + seg.join(' ') + '"/>'; };
    tr.forEach((q) => {
      const v = q.alt > Math.max(Sun.horizonAt(p.hzArr, q.az), 0), pt = X(q.az).toFixed(1) + ',' + Y(q.alt).toFixed(1);
      if (vis !== null && v !== vis) { seg.push(pt); flush(); seg = []; }
      vis = v; seg.push(pt);
    });
    flush();
    let poly = 'M' + x0 + ' ' + y1;
    for (let az = A0; az <= A1; az += 2) poly += 'L' + X(az).toFixed(1) + ' ' + Y(Math.max(0, Sun.horizonAt(p.hzArr, az))).toFixed(1);
    s += '<path d="' + poly + 'L' + x1 + ' ' + y1 + 'Z" fill="var(--ink)" opacity=".78"/>';
    tr.forEach((q) => {
      const pp = T.parts(q.ms);
      if (pp.min === 0 && pp.h % 2 === 0 && q.alt > 1) s += '<circle cx="' + X(q.az).toFixed(1) + '" cy="' + Y(q.alt).toFixed(1) + '" r="2.6" fill="var(--surface)" stroke="var(--sun-ink)" stroke-width="1.2"/><text x="' + X(q.az).toFixed(1) + '" y="' + (Y(q.alt) - 6).toFixed(1) + '" text-anchor="middle">' + pp.h + '</text>';
    });
    const now = E.now();
    if (T.dayStart(now) === dayStart) { const q = Sun.position(now, p.la, p.lo); if (q.alt > 0 && q.az >= A0 && q.az <= A1) s += '<circle cx="' + X(q.az).toFixed(1) + '" cy="' + Y(q.alt).toFixed(1) + '" r="6" fill="var(--sun)" stroke="var(--surface)" stroke-width="2"/>'; }
    [['E', 90], ['SE', 135], ['S', 180], ['SW', 225], ['W', 270]].forEach((c) => { s += '<text x="' + X(c[1]) + '" y="' + (y1 + 14) + '" text-anchor="middle">' + c[0] + '</text>'; });
    s += '<text x="' + x1 + '" y="' + (H - 3) + '" text-anchor="end">dashed: 21 June and 21 December</text>';
    return s + '</svg>';
  }

      + '<div class="field"><label for="s-theme">Theme</label><select id="s-theme"><option value="auto"' + (s.theme === 'auto' ? ' selected' : '') + '>Match device</option><option value="light"' + (s.theme === 'light' ? ' selected' : '') + '>Light</option><option value="dark"' + (s.theme === 'dark' ? ' selected' : '') + '>Dark</option></select></div></div>'
      + '<div class="field"><label for="s-lang">Language</label><select id="s-lang"><option value=""' + (!s.lang ? ' selected' : '') + '>Match device</option><option value="en"' + (s.lang === 'en' ? ' selected' : '') + '>English</option><option value="de"' + (s.lang === 'de' ? ' selected' : '') + '>Deutsch</option></select></div></div>'
      + '<div class="card"><h3>How it works</h3><p class="small muted" style="margin:0 0 8px">For each of ' + E.places.length + ' places the app combines three things: the low, mid and high cloud forecast; the real skyline, so it knows when mountains block the low winter sun; and the height of the fog top, read from how the low cloud changes with altitude across neighbouring places. The conversion from cloud to sunshine was calibrated on MeteoSwiss sunshine measurements.</p>'
      + '<p class="small muted" style="margin:0 0 8px">Near the top of the fog a difference of 100 m decides between grey and blue sky, and no forecast is that precise. That is why the measured sunshine and the webcams are one tap away.</p>'
      + '<p class="small muted" style="margin:0">Data: Open-Meteo (forecast, CC BY 4.0), MeteoSwiss (measurements), swisstopo (maps, place names), OpenStreetMap contributors (webcam locations, map outside Switzerland via CARTO), OSRM (road routing), transport.opendata.ch (timetable), Mapzen terrain tiles on AWS. Webcam images belong to their operators.</p></div>'
      + '<div class="card"><div class="btns"><button type="button" class="btn" data-act="reset">Reset all settings</button><button type="button" class="btn" data-act="clear">Clear cached data</button></div></div></div>';
    sh.hidden = false; sh.scrollTop = 0;
  };
  UI.closeSettings = function () { $('#settings').hidden = true; };
  UI.searchResults = function (list, err) {
    const box = $('#qres');
    if (!box) return;
    if (err) { box.innerHTML = '<small>Search failed: ' + esc(err) + '</small>'; return; }
    if (!list.length) { box.innerHTML = '<small>Nothing found.</small>'; return; }
    box.innerHTML = '<div class="searchres">' + list.map((r, k) => '<button type="button" data-res="' + k + '">' + esc(r.label) + '</button>').join('') + '</div>';
    box._list = list;
  };
})();

</script>
<script>
/* Sonnenseite - application state and wiring. */
(function () {
  'use strict';
  const SS = window.SS, U = SS.util, T = SS.tz, E = SS.engine, M = SS.map, UI = SS.ui, Sun = SS.sun, $ = U.$;
  const A = (SS.app = {});
  const KEY = 'ss.settings.v1';
  const DEFAULTS = {
    home: { lat: 47.3769, lon: 8.5417, name: 'Zürich', ele: 408, gps: false },
    units: 'metric', theme: 'auto', model: 'best_match', sort: 'best', maxTravel: 150, altMin: 0, altMax: 4000,
    kinds: { peak: true, hill: true, village: true, pass: true, town: true }, hideClosed: true, favOnly: false, favs: {}, reluctance: 1, mode: 'car',
    base: 'grey', layers: { fog: true, stations: true, webcams: false }, fogManual: null, archive: null,
  };
  const saved = U.load(KEY, {}) || {};
  A.state = Object.assign({}, DEFAULTS, saved);
  A.state.kinds = Object.assign({}, DEFAULTS.kinds, saved.kinds || {});
  A.state.layers = Object.assign({}, DEFAULTS.layers, saved.layers || {});
  A.state.favs = Object.assign({}, saved.favs || {});
  A.state.home = Object.assign({}, DEFAULTS.home, saved.home || {});
  SS.state = A.state;
  A.home = A.state.home;
  A.sel = { dayStart: T.dayStart(Date.now()), atMs: Math.floor(Date.now() / 3600000) * 3600000 };
  A.listLimit = 40;
  A.save = () => U.save(KEY, A.state);
  A.isDark = () => A.state.theme === 'dark' || (A.state.theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  function applyTheme() {
    const r = document.documentElement;
    if (A.state.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', A.state.theme);
    if (M.refreshTheme && M.leaflet) M.refreshTheme();
    if (SS.native) SS.native.setBars(A.isDark());
  }

  /* ---------------------------------------------------------------- derive and render */
  function rank() {
    const s = A.state;
    E.mode = s.mode === 'train' ? 'train' : 'car';
    const opts = { dayStart: A.sel.dayStart, nowMs: E.now(), atMs: A.sel.atMs, maxTravel: s.maxTravel, altMin: s.altMin, altMax: s.altMax, kinds: s.kinds, sort: s.sort, hideClosed: s.hideClosed, favOnly: s.favOnly, favs: s.favs, reluctance: s.reluctance };
    A.ranked = E.rank(opts);
    /* tomorrow at a glance: from midday on, point out a clear-cut sunny trip for the next day */
    A.tomorrow = null;
    const now = E.now();
    if (!E.fc.archive && T.dayStart(now) === A.sel.dayStart && T.hour(now) >= 12) {
      const d1 = E.days().find((d) => d > A.sel.dayStart);
      if (d1) {
        const best = E.rank(Object.assign({}, opts, { dayStart: d1, atMs: d1 + 12 * 3600000, sort: 'best' })).find((r) => !r.closed && !r.liftClosed && r.day.conf === 'likely' && r.sunMin >= 120);
        if (best) A.tomorrow = { dayStart: d1, p: best.p, conf: best.day.conf, sunMin: best.sunMin, total: best.travel.total };
      }
    }
  }
  /* after each render: check lifts, train times and webcams for the places on screen, then render again once */
  let followTimer = 0;
  const rerenderSoon = () => { clearTimeout(followTimer); followTimer = setTimeout(A.render, 400); };
  function followUp() {
    if (!E.fc || E.fc.archive) return;
    const rows = A.ranked || [], ds = A.sel.dayStart, sel = A.selPlace ? E.byId[A.selPlace] : null;
    const top = rows.slice(0, 25).map((r) => r.p);
    E.checkLifts((sel ? [sel] : []).concat(top), ds).then((ch) => { if (ch) rerenderSoon(); });
    if (A.tomorrow) E.checkLifts([A.tomorrow.p], A.tomorrow.dayStart).then((ch) => { if (ch) rerenderSoon(); });
    if (A.state.mode === 'train' && E.driveHome) {
      const today = T.dayStart(E.now()) === ds;
      E.loadPt(A.home, top.slice(0, 24).concat(sel ? [sel] : []), ds, today ? null : ds + 8 * 3600000).then((ch) => { if (ch) rerenderSoon(); });
    }
    if (T.dayStart(E.now()) === ds) {
      const cams = rows.slice(0, 12).map((r) => E.bestCam(r.p));
      if (sel) E.webcamsNear(sel, 6).forEach((w) => { if (w.p === 'roundshot' && w.i) cams.push(w); });
      E.checkCams(cams).then((ch) => { if (ch) rerenderSoon(); });
    }
  }
  /* forecast for any point tapped on the map */
  async function pointForecast(ll) {
    if (!E.fc || !ll) return;
    const lat = ll.lat, lon = ll.lng;
    if (lat < 45.75 || lat > 47.9 || lon < 5.9 || lon > 10.55) return;
    M.popup(ll, '<b>This spot</b><br><span class="muted">Looking up the height…</span>');
    const z0 = await E.elevationAt(lat, lon), z = z0 == null ? null : Math.max(0, z0);
    const h = E.hourIndex(A.sel.atMs), est = z == null ? null : E.atPoint(lat, lon, z, h), day = z == null ? null : E.pointDay(lat, lon, z, A.sel.dayStart);
    const today = T.dayStart(E.now()) === A.sel.dayStart;
    const word = !est ? 'No estimate here' : !est.up ? 'Sun below the horizon' : est.sun >= 0.6 ? 'Sunny' : est.sun >= 0.4 ? 'Mostly sunny' : est.sun >= 0.2 ? 'Some sun' : est.low >= 0.6 ? 'Fog or low cloud' : 'Cloudy';
    let near = null, nd = 1e9;
    E.places.forEach((q) => { const d = U.haversine(lat, lon, q.la, q.lo); if (d < nd) { nd = d; near = q; } });
    const html = '<b>' + U.esc(word) + '</b> <span class="muted">at ' + T.hm(A.sel.atMs) + '</span><br>'
      + (z == null ? 'Height unknown' : U.fmtAlt(z)) + (day && day.known ? ' · about ' + U.fmtSunHours(day.sunMin) + ' of sun ' + (today ? 'today' : 'that day') : '')
      + '<br><span class="muted" style="font-size:12px">Estimated from the regional forecast. Mountains around this point are not taken into account, so in a valley it can look too sunny.</span>'
      + '<div class="pop-btns"><button type="button" class="pop-btn" data-pt="home">Start from here</button><a class="pop-btn" href="https://www.google.com/maps/dir/?api=1&destination=' + lat.toFixed(5) + ',' + lon.toFixed(5) + '" target="_blank" rel="noopener">Navigate</a></div>';
    M.popup(ll, html, (e) => {
      if (!e.target.closest('[data-pt="home"]')) return;
      M.closePopup();
      A.setHome({ lat: lat, lon: lon, name: near && nd < 5 ? 'Near ' + near.n : 'Map point' });
      UI.toast('Starting point set to this spot.');
    });
  }

  function fogField() {
    if (!A.state.layers.fog || !E.fc) { M.setFog(null); return; }
    if (A.state.fogManual != null) { const t = A.state.fogManual; M.setFog(() => t); return; }
    const h = E.hourIndex(A.sel.atMs), anchors = [];
    E.places.forEach((p) => {
      if (p.k !== 'town') return;
      const pr = E.profile(p.la, p.lo, h);
      anchors.push([p.la, p.lo, pr.state === 'fog' ? pr.top : pr.state === 'deck' ? Math.min(2200, pr.lo + 150) : 0]);
    });
    if (!anchors.some((a) => a[2] > 0)) { M.setFog(null); return; }
    M.setFog((lat, lon) => {
      let sw = 0, st = 0;
      for (let i = 0; i < anchors.length; i++) {
        const a = anchors[i], dy = (lat - a[0]) * 111, dx = (lon - a[1]) * 76, d2 = dx * dx + dy * dy;
        if (d2 > 4900) continue;
        const w = 1 / (d2 + 30); sw += w; st += w * a[2];
      }
      return sw ? st / sw : 0;
    });
  }
  function paintMap() {
    if (!E.fc) return;
    const h = E.hourIndex(A.sel.atMs), inList = {};
    (A.ranked || []).forEach((r) => { inList[r.p.id] = 1; });
    M.paintPlaces((p) => { const o = E.hour(p.i, h) || { state: 'nodata', sun: 0 }; return { sun: o.sun, state: o.state, dim: !inList[p.id], fav: !!A.state.favs[p.id], sel: A.selPlace === p.id }; });
    fogField();
    UI.renderLegend();
  }
  A.render = function () {
    if (E.fc) rank();
    UI.renderWhen(); UI.renderBrief(); UI.renderList(); UI.renderCredits(); paintMap();
    if (A.selPlace && !$('#sheet').hidden) { const y = $('#sheet').scrollTop; UI.openPlace(A.selPlace); $('#sheet').scrollTop = y; }
    followUp();
  };

  /* ---------------------------------------------------------------- loading */
  function pickDefaultTime() {
    const now = E.now(), days = E.days();
    A.sel.dayStart = T.dayStart(now); A.sel.atMs = Math.floor(now / 3600000) * 3600000;
    const sun = Sun.position(now, A.home.lat, A.home.lon);
    if (!E.fc.archive && sun.alt < 0 && T.hour(now) >= 15 && days.length > 1) { A.sel.dayStart = days.find((d) => d > A.sel.dayStart) || A.sel.dayStart; A.sel.atMs = A.sel.dayStart + 12 * 3600000; }
    if (days.length && days.indexOf(A.sel.dayStart) < 0) { A.sel.dayStart = days[0]; A.sel.atMs = days[0] + 12 * 3600000; }
  }
  function friendly(err) {
    const m = String((err && err.message) || err || '');
    if (/limit/i.test(m)) return 'The weather service has hit its request limit for your network. Try again in a while.';
    if (/Failed to fetch|NetworkError|timed out|Load failed/i.test(m)) return 'No connection to the weather service. Check your internet connection.';
    return m || 'Unknown error.';
  }
  A.loadAll = async function (force, keepTime) {
    const btn = $('#btn-refresh'); btn.classList.add('spin');
    UI.banner(null);
    try {
      await E.loadForecast({ model: A.state.model, archive: A.state.archive, force: !!force });
      if (!keepTime) pickDefaultTime();
      if (E.fc.stale) UI.banner('Showing the forecast from ' + T.hm(E.fc.fetched) + '. ' + friendly(E.fc.error), 'Retry', () => A.loadAll(true, true));
    } catch (err) {
      UI.banner('Could not load the forecast. ' + friendly(err), 'Retry', () => A.loadAll(true));
    }
    btn.classList.remove('spin');
    A.render();
    if (E.fc && !E.fc.archive) loadObs(); else { E.obs = null; M.paintStations(); }
  };
  async function loadObs() {
    try { await E.loadObs(); M.paintStations(); A.render(); } catch (e) { /* measurements are optional */ }
  }
  async function loadDrive() {
    await E.loadDrive(A.home);
    if (E.fc) A.render();
  }
  A.setHome = async function (h) {
    let ele = null, name = h.name, best = null, bd = 1e9;
    E.places.forEach((p) => { const d = U.haversine(h.lat, h.lon, p.la, p.lo); if (d < bd) { bd = d; best = p; } });
    if (best && bd < 1.5) ele = best.e;
    if (ele == null) ele = await E.elevationAt(h.lat, h.lon);
    if (ele == null) ele = best ? best.e : 450;
    if (h.gps) name = best && bd < 5 ? 'Near ' + best.n : 'My position';
    A.state.home = A.home = { lat: h.lat, lon: h.lon, name: name, ele: Math.round(ele), gps: !!h.gps };
    A.save(); M.setHome(A.home);
    A.render();
    await loadDrive();
  };
  A.useGps = function () {
    UI.toast('Finding your position…', 8000);
    SS.native.getPosition().then((pos) => {
      const lat = pos.lat, lon = pos.lon;
      M.setMe(lat, lon, pos.accuracy);
      if (lat < 45.7 || lat > 47.95 || lon < 5.8 || lon > 10.6) { UI.toast('You seem to be outside Switzerland, so ' + A.home.name + ' stays the starting point.', 5000); return; }
      UI.toast('Starting point set to your position.');
      A.setHome({ lat: lat, lon: lon, name: 'My position', gps: true });
    }, (err) => {
      UI.toast(err && err.code === 1 ? (SS.native.is ? 'Location access is off. Turn it on for Sonnenseite in your phone settings, or choose a starting point in Settings.' : 'Location access was refused. Allow it for this page, or choose a starting point in Settings.') : 'Could not get your position. Choose a starting point in Settings.', 6000);
    });
  };

  /* ---------------------------------------------------------------- events */
  function setView(v) {
    $('#app').dataset.view = v;
    $('#view-label').textContent = v === 'map' ? 'List' : 'Map';
    $('#view-ic').setAttribute('href', v === 'map' ? '#i-list' : '#i-map');
    setTimeout(() => { M.invalidate(); paintMap(); }, 30);
  }
  function syncLayerUi() {
    const s = A.state;
    U.$$('#base-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.base === s.base)));
    $('#lay-fog').checked = s.layers.fog; $('#lay-stations').checked = s.layers.stations; $('#lay-webcams').checked = s.layers.webcams;
    $('#fog-manual').checked = s.fogManual != null; $('#fog-top').disabled = s.fogManual == null;
    if (s.fogManual != null) $('#fog-top').value = s.fogManual;
    $('#fog-top-label').textContent = s.fogManual != null ? U.fmtAlt(s.fogManual) : 'automatic';
  }
  function wire() {
    $('#days').addEventListener('click', (e) => {
      const b = e.target.closest('[data-day]'); if (!b) return;
      const d = +b.dataset.day, hod = T.hour(A.sel.atMs);
      A.sel.dayStart = d; A.sel.atMs = d + hod * 3600000; A.listLimit = 40; A.render();
    });
    let raf = 0;
    $('#hour').addEventListener('input', (e) => {
      A.sel.atMs = A.sel.dayStart + +e.target.value * 3600000;
      $('#hour-label').textContent = T.hm(A.sel.atMs);
      cancelAnimationFrame(raf); raf = requestAnimationFrame(A.render);
    });
    $('#btn-now').addEventListener('click', () => { if (E.fc) { pickDefaultTime(); A.render(); } });
    $('#btn-home').addEventListener('click', UI.openSettings);
    $('#btn-settings').addEventListener('click', UI.openSettings);
    $('#btn-filter').addEventListener('click', UI.openSettings);
    $('#btn-refresh').addEventListener('click', () => A.loadAll(true, true));
    $('#sort').value = A.state.sort;
    $('#sort').addEventListener('change', (e) => { A.state.sort = e.target.value; A.save(); A.listLimit = 40; A.render(); });
    $('#results').addEventListener('click', (e) => {
      if (e.target.closest('#more')) { A.listLimit += 40; UI.renderList(); return; }
      const r = e.target.closest('[data-id]'); if (r) openPlace(r.dataset.id);
    });
    $('#brief').addEventListener('click', (e) => {
      const dd = e.target.closest('[data-day]');
      if (dd) { const d = +dd.dataset.day; A.sel.dayStart = d; A.sel.atMs = d + 12 * 3600000; A.listLimit = 40; A.render(); return; }
      const r = e.target.closest('[data-id]'); if (r) openPlace(r.getAttribute('data-id'));
    });
    $('#btn-view').addEventListener('click', () => setView($('#app').dataset.view === 'map' ? 'list' : 'map'));
    $('#btn-layers').addEventListener('click', () => { const p = $('#layers'); p.hidden = !p.hidden; $('#btn-layers').classList.toggle('on', !p.hidden); });
    $('#btn-locate').addEventListener('click', A.useGps);
    $('#base-seg').addEventListener('click', (e) => { const b = e.target.closest('[data-base]'); if (!b) return; A.state.base = b.dataset.base; A.save(); M.setBase(A.state.base); syncLayerUi(); });
    [['lay-fog', 'fog'], ['lay-stations', 'stations'], ['lay-webcams', 'webcams']].forEach((x) => {
      $('#' + x[0]).addEventListener('change', (e) => { A.state.layers[x[1]] = e.target.checked; A.save(); M.setLayer(x[1], e.target.checked); if (x[1] === 'fog') fogField(); if (x[1] === 'stations') M.paintStations(); });
    });
    $('#fog-manual').addEventListener('change', (e) => {
      if (e.target.checked) { const pr = E.fc ? E.profile(A.home.lat, A.home.lon, E.hourIndex(A.sel.atMs)) : {}; A.state.fogManual = pr.top ? Math.round(pr.top / 25) * 25 : 1000; if (!A.state.layers.fog) { A.state.layers.fog = true; M.setLayer('fog', true); } }
      else A.state.fogManual = null;
      A.save(); syncLayerUi(); fogField();
    });
    $('#fog-top').addEventListener('input', (e) => { A.state.fogManual = +e.target.value; $('#fog-top-label').textContent = U.fmtAlt(A.state.fogManual); fogField(); });
    $('#fog-top').addEventListener('change', A.save);

    /* place sheet */
    $('#sheet').addEventListener('click', async (e) => {
      const act = e.target.closest('[data-act]'), sh = $('#sheet'), p = E.byId[A.selPlace];
      const cam = e.target.closest('[data-cam]'), day = e.target.closest('[data-day]');
      if (cam && sh._cams) { UI.showCam(sh._cams[+cam.dataset.cam]); return; }
      if (day) { const d = +day.dataset.day, hod = T.hour(A.sel.atMs); A.sel.dayStart = d; A.sel.atMs = d + hod * 3600000; A.render(); $('#sheet').scrollTop = 0; return; }
      if (!act || !p) return;
      const a = act.dataset.act;
      if (a === 'close') { UI.closeSheet(); paintMap(); }
      else if (a === 'fav') { if (A.state.favs[p.id]) delete A.state.favs[p.id]; else A.state.favs[p.id] = 1; A.save(); A.render(); UI.toast(A.state.favs[p.id] ? 'Saved' : 'Removed from saved places'); }
      else if (a === 'route') {
        UI.toast('Finding the route…', 8000);
        try { const r = await E.route(A.home, p); UI.closeSheet(); setView('map'); setTimeout(() => M.showRoute(r.line), 80); UI.toast(U.fmtDur(r.min) + ' by car, ' + U.fmtDist(r.km) + (p.nav ? ' to ' + p.nav[2] : ''), 6000); }
        catch (err) { UI.toast('No route found. The routing service may be busy.'); }
      } else if (a === 'conn') {
        UI.showConnections(null);
        const future = !E.fc.archive && A.sel.dayStart > T.dayStart(Date.now());      /* timetable lookups only make sense for today or later */
        try { UI.showConnections(await E.connections(A.home, p, future ? A.sel.dayStart + 8 * 3600000 : null)); }
        catch (err) { UI.showConnections(null, friendly(err)); }
      }
    });

    /* settings sheet */
    const st = $('#settings');
    const changed = () => { A.save(); A.listLimit = 40; A.render(); };
    st.addEventListener('click', async (e) => {
      const act = e.target.closest('[data-act]'), home = e.target.closest('[data-home]'), res = e.target.closest('[data-res]');
      if (home) { const p = E.places.find((x) => x.n === home.dataset.home); if (p) { UI.closeSettings(); await A.setHome({ lat: p.la, lon: p.lo, name: p.n }); UI.toast('Starting point: ' + p.n); } return; }
      if (res) { const r = $('#qres')._list[+res.dataset.res]; UI.closeSettings(); await A.setHome({ lat: r.lat, lon: r.lon, name: r.label.replace(/\s*\([A-Z]{2}\).*$/, '').trim() || r.label }); UI.toast('Starting point changed.'); return; }
      if (!act) return;
      const a = act.dataset.act;
      if (a === 'close') UI.closeSettings();
      else if (a === 'gps') { UI.closeSettings(); A.useGps(); }
      else if (a === 'live') { A.state.archive = null; A.save(); UI.closeSettings(); A.loadAll(true); }
      else if (a === 'clear') { E.clearCaches(); UI.toast('Cached data cleared.'); A.loadAll(true, true); loadDrive(); }
      else if (a === 'reset') { U.drop(KEY); E.clearCaches(); location.reload(); }
    });
    st.addEventListener('input', (e) => {
      const t = e.target, s = A.state;
      if (t.id === 's-travel') { s.maxTravel = +t.value; $('#o-travel').textContent = U.fmtDur(s.maxTravel); }
      else if (t.id === 's-rel') { s.reluctance = +t.value; $('#o-rel').textContent = s.reluctance <= 0.3 ? 'sun matters most' : s.reluctance >= 1.5 ? 'strongly' : 'balanced'; }
      else if (t.id === 's-amin') { s.altMin = Math.min(+t.value, s.altMax - 100); $('#o-amin').textContent = U.fmtAlt(s.altMin); }
      else if (t.id === 's-amax') { s.altMax = Math.max(+t.value, s.altMin + 100); $('#o-amax').textContent = U.fmtAlt(s.altMax); }
    });
    const search = U.debounce(async (q) => { if (q.trim().length < 2) { $('#qres').innerHTML = ''; return; } try { UI.searchResults(await E.search(q)); } catch (err) { UI.searchResults([], friendly(err)); } }, 350);
    st.addEventListener('keyup', (e) => { if (e.target.id === 'q') search(e.target.value); });
    st.addEventListener('change', (e) => {
      const t = e.target, s = A.state;
      if (t.dataset.kind) { s.kinds[t.dataset.kind] = t.checked; changed(); }
      else if (t.id === 's-closed') { s.hideClosed = t.checked; changed(); }
      else if (t.id === 's-fav') { s.favOnly = t.checked; changed(); }
      else if (t.id === 's-mode') { s.mode = t.value; changed(); }
      else if (t.id === 's-lang') { s.lang = t.value; A.save(); location.reload(); }
      else if (t.id === 's-units') { s.units = t.value; changed(); syncLayerUi(); }
      else if (t.id === 's-theme') { s.theme = t.value; applyTheme(); changed(); }
      else if (t.id === 's-model') { s.model = t.value; A.save(); $('#model-note').textContent = (E.MODELS.find((m) => m.id === s.model) || {}).note || ''; A.loadAll(true, true); }
      else if (t.id === 's-archive') { s.archive = t.value || null; A.save(); UI.closeSettings(); A.loadAll(true); }
      else if (['s-travel', 's-rel', 's-amin', 's-amax'].indexOf(t.id) >= 0) changed();
    });
    A.back = function () {
      if (!$('#settings').hidden) { UI.closeSettings(); return true; }
      if (!$('#sheet').hidden) { UI.closeSheet(); paintMap(); return true; }
      if (!$('#layers').hidden) { $('#layers').hidden = true; $('#btn-layers').classList.remove('on'); return true; }
      if ($('#app').dataset.view === 'map' && window.innerWidth < 900) { setView('list'); return true; }
      return false;
    };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') A.back(); });
    if (SS.native) SS.native.onBack(A.back);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', () => { if (A.state.theme === 'auto') { M.refreshTheme(); paintMap(); } }); }
    window.addEventListener('resize', U.debounce(() => M.invalidate(), 150));
  }
  function openPlace(id) {
    UI.openPlace(id); paintMap(); followUp();
    const p = E.byId[id];
    if (p && window.innerWidth >= 900) M.focus(p, 10);
  }
  /* periodic refresh: measurements every 10 minutes, forecast after an hour */
  function tick() {
    if (!E.fc || E.fc.archive || document.hidden) return;
    if (Date.now() - E.fc.fetched > 61 * 60000) A.loadAll(false, true);
    else if (!E.obs || Date.now() - E.obs.fetched > 9.5 * 60000) loadObs();
  }

  A.boot = function () {
    applyTheme();
    E.init();
    UI.renderBrief(); UI.renderList();
    M.init({ onPlace: openPlace, onMapClick: pointForecast });
    M.setBase(A.state.base); M.setHome(A.home);
    ['fog', 'stations', 'webcams'].forEach((k) => M.setLayer(k, !!A.state.layers[k]));
    M.fitAround(A.home, 75);
    wire(); syncLayerUi(); UI.renderWhen();
    A.loadAll(false);
    loadDrive();
    setInterval(tick, 5 * 60000);
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !(SS.native && SS.native.is)) navigator.serviceWorker.register('sw.js').catch(() => {});
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', A.boot); else A.boot();
})();

</script>
